name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/aster-release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/aster-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Two APKs: the Play Store's package name for GitHub, and the Amazon Appstore's older one, which its listing
        # can't change (see appId in app/build.gradle.kts).
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "aster-${GITHUB_REF_NAME}.apk"
          ./gradlew assembleRelease -PappId=com.astermediaplayer.astermediaplayer
          mv app/build/outputs/apk/release/app-release.apk "aster-${GITHUB_REF_NAME}-amazon.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: aster-*.apk
          generate_release_notes: true
